name: Предложение
description: Обсудить улучшение или новый сценарий.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача
      description: Какой сценарий нужно улучшить и для кого?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предложение
      description: Ожидаемый результат, альтернативы и ограничения.
    validations:
      required: true
